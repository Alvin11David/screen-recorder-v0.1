server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  undertow:
    threads:
      io: ${UNDERTOW_IO_THREADS:2}
      worker: ${UNDERTOW_WORKER_THREADS:64}
    no-request-timeout: 60000
    buffer-size: ${UNDERTOW_BUFFER_SIZE:16384}
    buffers-per-region: 16

spring:
  application:
    name: screen-capture-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/screencapture;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 3000
      validation-timeout: 1500
      max-lifetime: 1800000
      pool-name: ScreenCaptureHikariPool
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2}
    expiration-ms: 86400000
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  security:
    reset-code:
      length: ${RESET_CODE_LENGTH:4}
      ttl-seconds: ${RESET_CODE_TTL_SECONDS:900}
      max-attempts: ${RESET_CODE_MAX_ATTEMPTS:5}
      cooldown-seconds: ${RESET_CODE_COOLDOWN_SECONDS:60}
      max-per-window: ${RESET_CODE_MAX_PER_WINDOW:5}
      window-minutes: ${RESET_CODE_WINDOW_MINUTES:15}
      cleanup-interval-ms: ${RESET_CODE_CLEANUP_INTERVAL_MS:60000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:console}
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    auth: ${SMTP_AUTH:true}
    starttls: ${SMTP_STARTTLS:true}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:ScreenFlow}
    console-fallback: ${MAIL_CONSOLE_FALLBACK:true}
    subject: ${MAIL_SUBJECT:Your ScreenFlow password reset code}
    emailjs:
      api-url: ${EMAILJS_API_URL:https://api.emailjs.com/api/v1.0/email/send}
      service-id: ${EMAILJS_SERVICE_ID:}
      public-key: ${EMAILJS_PUBLIC_KEY:}
      private-key: ${EMAILJS_PRIVATE_KEY:}
      template-id: ${EMAILJS_TEMPLATE_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://screenflow26.netlify.app}
