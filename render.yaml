services:
  - type: web
    name: screenflow-backend
    runtime: docker
    repo: https://github.com/Alvin11David/screen-recorder-v0.1
    branch: main
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: "8080"
      # Strong JWT signing secret (auto-generated once at deploy time)
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed frontend origins
      - key: CORS_ALLOWED_ORIGINS
        value: https://screen-recorder-v0-1.vercel.app,http://localhost:5173,http://localhost:3000
      # No SMTP configured yet -> reset codes are printed to the Render logs (DEV ONLY)
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_CONSOLE_FALLBACK
        value: "true"
      # Enable real emails once you have an SMTP provider:
      # - key: MAIL_ENABLED
      #   value: "true"
      # - key: SMTP_HOST
      #   value: smtp.example.com
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USERNAME
      #   value: your_smtp_username
      # - key: SMTP_PASSWORD
      #   value: your_smtp_password
      # - key: MAIL_FROM
      #   value: no-reply@yourdomain.com
      # - key: MAIL_FROM_NAME
      #   value: ScreenFlow
      # - key: MAIL_CONSOLE_FALLBACK
      #   value: "false"
      # Switch to Postgres for durable data:
      # - key: JDBC_DATABASE_URL
      #   fromDatabase:
      #     name: screenflow-db
      #     property: connectionString

# Optional managed Postgres (comment in JDBC_DATABASE_URL above to use it):
# databases:
#   - name: screenflow-db
#     plan: basic-256mb
